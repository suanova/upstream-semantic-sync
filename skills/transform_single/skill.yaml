name: transform_single
version: "1.0"
description: |
  Transform an upstream change for a single downstream target file.
  Called once per file by stage_transform to avoid oversized LLM prompts.
inputs:
  - name: analysis
    type: object
    required: true
    description: Upstream commit analysis
  - name: mappings
    type: object
    required: true
    description: Architecture mappings
  - name: conventions
    type: string
    required: false
    description: Downstream conventions from knowledge/conventions.md
  - name: target_path
    type: string
    required: true
    description: Downstream file path to transform
  - name: upstream_path
    type: string
    required: false
    description: Upstream file path that maps to this target
  - name: downstream_file
    type: string
    required: false
    description: Current contents of the downstream file
outputs:
  - name: path
    type: string
    description: Downstream file path
  - name: content
    type: string
    description: Complete modified file content
  - name: confidence
    type: string
    description: high, medium, or low
  - name: is_conflict
    type: boolean
    description: True if this target could not be transformed
# Single file — much lighter than the batch transform.
# Still need decent max_tokens for returning complete file content.
max_tokens: 16384
timeout: 180

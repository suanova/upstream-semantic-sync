name: resolve_single
version: "3.0"
description: |
  LLM fallback for a single downstream file whose upstream diff failed to
  apply with `git apply`. Called once per failed file by
  stage_resolve_conflicts. Uses knowledge/conventions.md to adapt the
  upstream intent to the diverged downstream code. Returns targeted
  search/replace edits (not the full file) so completions stay small
  even for large files — this avoids gateway timeouts.
inputs:
  - name: conflict_description
    type: string
    required: true
    description: Why the direct git apply failed for this file
  - name: conflict_region
    type: string
    required: false
    description: Line range or symbol name of the conflict
  - name: analysis
    type: object
    required: true
    description: Upstream commit summary (intent, type, risk)
  - name: conventions
    type: string
    required: false
    description: Downstream conventions from knowledge/conventions.md
  - name: target_path
    type: string
    required: true
    description: Downstream file path
  - name: upstream_path
    type: string
    required: false
    description: Upstream file path that maps to this target
  - name: downstream_file
    type: string
    required: false
    description: Current contents of the downstream file (may be truncated)
  - name: upstream_file_diff
    type: string
    required: false
    description: Upstream diff for this specific file (paths rewritten downstream)
outputs:
  - name: path
    type: string
    description: Downstream file path
  - name: edits
    type: list[object]
    description: Targeted search/replace edits ({old, new}) — preferred output; small completion, applied by exact match
  - name: content
    type: string
    description: Complete file content — only for new files that don't exist downstream
  - name: confidence
    type: string
    description: high, medium, or low
  - name: is_conflict
    type: boolean
    description: True if still cannot be resolved
max_tokens: 8192
timeout: 180
